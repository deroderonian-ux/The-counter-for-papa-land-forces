<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa Land Forces - Cuenta Regresiva</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #090909 url("fondo.png") center/cover fixed no-repeat;
      padding: 20px;
    }
    .panel {
      width: min(900px, 100%);
      padding: 24px;
      border: 2px solid #b87920;
      border-radius: 18px;
      background: rgba(0,0,0,.72);
      box-shadow: 0 0 35px rgba(255, 60, 0, .25);
      backdrop-filter: blur(3px);
    }
    .logo {
      width: min(760px, 100%);
      max-height: 250px;
      object-fit: contain;
      display: block;
      margin: 0 auto 18px;
      border-radius: 8px;
    }
    h1 {
      margin: 8px 0;
      letter-spacing: 3px;
      font-size: clamp(22px, 5vw, 40px);
    }
    .sub {
      margin: 0 0 20px;
      color: #e0b56b;
      font-size: 18px;
    }
    #tiempo {
      font-size: clamp(30px, 8vw, 70px);
      font-weight: 900;
      letter-spacing: 2px;
      margin: 20px 0;
      text-shadow: 0 0 15px rgba(255, 90, 0, .65);
    }
    .boton {
      border: 1px solid #b87920;
      border-radius: 10px;
      background: #17110b;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .boton:hover { background: #2a1a0d; }
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="logo.jpg" alt="Papa Land Forces - Era of Noshturl">
    <h1>CUENTA REGRESIVA</h1>
    <p class="sub">Hasta el 5 de octubre de 2026</p>
    <div id="tiempo">Cargando...</div>
    <button class="boton" onclick="actualizar()">Actualizar</button>
  </main>

  <script>
    const fechaFinal = new Date("2026-10-05T00:00:00").getTime();

    function actualizar() {
      const diferencia = fechaFinal - Date.now();

      if (diferencia <= 0) {
        document.getElementById("tiempo").textContent =
          "🎉 ¡LLEGÓ EL 5 DE OCTUBRE!";
        return;
      }

      const dias = Math.floor(diferencia / 86400000);
      const horas = Math.floor((diferencia / 3600000) % 24);
      const minutos = Math.floor((diferencia / 60000) % 60);
      const segundos = Math.floor((diferencia / 1000) % 60);

      document.getElementById("tiempo").textContent =
        `${dias}d ${horas}h ${minutos}m ${segundos}s`;
    }

    actualizar();
    setInterval(actualizar, 1000);
  </script>
</body>
</html>
